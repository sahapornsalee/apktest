name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AutoPlayVideo-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AutoPlayVideo-apk
          path: AutoPlayVideo-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AutoPlayVideo v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: AutoPlayVideo-*.apk
